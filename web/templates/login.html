<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Review Agent — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f1f5f9;
    }
    .logo p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 0.4rem;
      margin-top: 1.2rem;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.9rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #6366f1; }
    button[type="submit"] {
      margin-top: 1.8rem;
      width: 100%;
      padding: 0.7rem;
      background: #6366f1;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4f46e5; }
    .error {
      margin-top: 1rem;
      padding: 0.65rem 0.9rem;
      background: #450a0a;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      color: #fca5a5;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Code Review Agent</h1>
      <p>Connectez-vous pour accéder au dashboard</p>
    </div>
    <form method="POST" action="/login">
      <label for="username">Nom d'utilisateur</label>
      <input type="text" id="username" name="username" required autofocus autocomplete="username" />

      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" />

      {{if .Error}}
      <div class="error">{{.Error}}</div>
      {{end}}

      <button type="submit">Se connecter</button>
    </form>
  </div>
</body>
</html>
