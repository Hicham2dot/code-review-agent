# Code Review Agent Configuration
llm:
  provider: nvidia
  model: google/gemma-3n-e2b-it
  max_tokens: 1024
  temperature: 0.7

cache:
  enabled: true
  dir: ~/.cache/code-review-agent
  ttl: 604800  # 7 days

analysis:
  local_checks: true
  ai_enabled: true
  threshold: 0.5

output:
  format: cli
